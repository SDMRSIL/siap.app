<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAP - RSIL</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0a1a11 0%, #10281B 45%, #1a3d28 80%, #BF9E7D 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff;
      text-align: center;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div>
    <div class="spinner"></div>
    <p>Mengalihkan ke SIAP...</p>
  </div>

  <script>
    // DEPLOYMENT_ID
    var target = 'https://script.google.com/macros/s/AKfycbwc70hektFPDU9XTTpBp8VzSvxpB_F36g7tXTooYA76COdaoWuCLEiH7CmjmOsRrlRD/exec';

    // Meneruskan semua query string (penting untuk parameter SSO dari SIAP: ?sso=&nip=&ssid=)
    window.location.replace(target + window.location.search);
  </script>
</body>
</html>
